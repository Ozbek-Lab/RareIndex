services:
  web:
    build: .
    env_file:
      - ./.env.prod
    environment:
      MARIMO_SERVICE_URL: ${MARIMO_SERVICE_URL:-/marimo-run}
      MARIMO_EDITOR_URL: ${MARIMO_EDITOR_URL:-/marimo-edit}
    depends_on:
      - db
    volumes:
      - static_volume:/app/staticfiles
    secrets:
      - email_host_user
      - email_host_password

  marimo-run:
    build: .
    command: marimo run lab/notebooks --host 0.0.0.0 --port 8091 --headless --no-token --base-url /marimo-run --allow-origins "*"
    env_file:
      - ./.env.prod
    environment:
      DJANGO_API_URL: ${DJANGO_API_URL:-http://web:8090}
    depends_on:
      - web

  marimo-edit:
    build: .
    command: marimo edit lab/notebooks --host 0.0.0.0 --port 8092 --headless --no-token --base-url /marimo-edit --allow-origins "*"
    env_file:
      - ./.env.prod
    environment:
      DJANGO_API_URL: ${DJANGO_API_URL:-http://web:8090}
    depends_on:
      - web

  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password

  caddy:
    image: caddy:2
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - static_volume:/app/staticfiles
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - marimo-run
      - marimo-edit

volumes:
  postgres_data:
  caddy_data:
  static_volume:

secrets:
  postgres_password:
    file: ./postgres_password.txt
  email_host_user:
    file: ./email_host_user.txt
  email_host_password:
    file: ./email_host_password.txt
